<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f6f2">
    <title>History · Anna TODO ticket</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="styles.css">
    <script src="history.js" type="module"></script>
  </head>
  <body>
    <main class="history-page">
      <header>
        <p class="eyebrow">Do more</p>
        <h1>Anna TODO ticket</h1>
      </header>
      <section id="auth-panel" class="auth-panel" aria-label="Sign in">
        <p id="auth-status" class="status" role="status">Checking sign-in…</p>
        <button id="sign-in" class="print" type="button" disabled>Sign in with Google</button>
      </section>
      <noscript>JavaScript is required to sign in.</noscript>
      <div id="protected-content" hidden>
      <section class="history-panel" aria-labelledby="history-heading">
        <h2 id="history-heading">History</h2>
        <div class="table-scroll" role="region" aria-label="Ticket history table" tabindex="0">
          <table>
            <thead>
              <tr>
                <th scope="col">Submitted</th>
                <th scope="col">Ticket</th>
                <th scope="col">Category</th>
                <th scope="col">Deadline</th>
                <th scope="col">Reprint?</th>
              </tr>
            </thead>
            <tbody id="ticket-history">
              <tr><td colspan="5" class="empty-history">No ticket history to show.</td></tr>
            </tbody>
          </table>
        </div>
        <nav class="pagination" aria-label="History pages">
          <button id="history-previous" type="button" disabled>Previous</button>
          <span id="history-page" aria-live="polite">Page 1</span>
          <button id="history-next" type="button" disabled>Next</button>
        </nav>
        <p id="history-status" class="status" role="status" aria-live="polite"></p>
      </section>
        <footer class="account-footer">
          <button id="sign-out" type="button">Sign out</button>
        </footer>
      </div>
    </main>
  </body>
</html>
