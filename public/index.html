<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f6f2">
    <title>Anna TODO ticket</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" type="module"></script>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">Do more</p>
        <h1>Anna TODO ticket</h1>
      </header>
      <section id="auth-panel" class="auth-panel" aria-label="Sign in">
        <p id="auth-status" class="status" role="status">Checking sign-in…</p>
        <button id="sign-in" class="print" type="button" disabled>Sign in with Google</button>
      </section>
      <noscript>JavaScript is required to sign in.</noscript>
      <div id="protected-content" hidden>
      <form id="ticket-form">
        <div class="field">
          <label for="task">Task description</label>
          <textarea id="task" name="task" rows="3" maxlength="1000" required placeholder="What needs doing?"></textarea>
        </div>
        <fieldset class="field">
          <legend>Category <span class="optional">Optional</span></legend>
          <div class="categories" aria-describedby="category-hint">
            <button type="button" class="category" aria-pressed="false" data-category="Council">Council</button>
            <button type="button" class="category" aria-pressed="false" data-category="Work">Work</button>
            <button type="button" class="category" aria-pressed="false" data-category="Life admin">Life admin</button>
          </div>
          <input type="hidden" id="category" name="category" value="">
          <!-- <p id="category-hint" class="hint">Tap again to clear your choice.</p> -->
        </fieldset>
        <div class="field">
          <label for="deadline">Deadline <span class="optional">Optional</span></label>
          <input type="date" min="0001-01-01" max="9999-12-31" id="deadline" name="deadline">
        </div>
        <button class="print" type="submit">Print</button>
        <p id="form-status" class="status" role="status" aria-live="polite"></p>
      </form>
      <footer class="page-footer">
        <a href="history.html">History</a>
      </footer>
        <footer class="account-footer">
          <button id="sign-out" type="button">Sign out</button>
        </footer>
      </div>
    </main>
  </body>
</html>
